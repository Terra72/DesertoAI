<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Desertification Intelligence Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>
<body>

<div id="map" role="application" aria-label="Map of desertification events by region"></div>

<section id="info" aria-live="polite">
    <h2 class="section-head">Region info</h2>
    <div id="info-body">Hover over or focus a region</div>
</section>

<section id="legend" aria-label="Map legend">
    <h2 class="section-head">Legend</h2>
    <div class="legend-body">
        <div class="legend-group">
            <h3 class="legend-title">Signal type</h3>
            <p class="legend-row">
                <span class="badge" data-signal="new">new</span>
                <span>fresh information</span>
            </p>
            <p class="legend-row">
                <span class="badge" data-signal="reinforcement">reinforcement</span>
                <span>confirms what we know</span>
            </p>
        </div>
        <div class="legend-group">
            <h3 class="legend-title">Event count</h3>
            <p class="legend-row">
                <span class="dot dot-small" aria-hidden="true"></span>
                <span>few events</span>
            </p>
            <p class="legend-row">
                <span class="dot dot-large" aria-hidden="true"></span>
                <span>many events</span>
            </p>
            <p class="legend-row">
                <span class="dot dot-muted" aria-hidden="true"></span>
                <span>no events yet</span>
            </p>
        </div>
    </div>
</section>

<aside id="panel" hidden>
    <header>
        <div>
            <h2 id="panel-title" class="section-head"></h2>
            <p id="panel-count"></p>
        </div>
        <button id="panel-close" type="button" aria-label="Close panel">&times;</button>
    </header>
    <div id="panel-body"></div>
</aside>

<script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
