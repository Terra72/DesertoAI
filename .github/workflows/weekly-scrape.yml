name: Weekly scrape

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

concurrency: weekly-scrape

permissions:
  contents: write
  pull-requests: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install anthropic python-dotenv feedparser numpy sentence-transformers
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Scrape and export
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m deserto.weekly

      - name: Open export PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "deserto-scraper"
          git config user.email "deserto-scraper@users.noreply.github.com"
          git add data/exports
          git diff --cached --quiet && echo "No new events" && exit 0
          week=$(date -u +%G-W%V)
          git checkout -b "weekly-export-$week-$GITHUB_RUN_ID"
          git commit -m "Add weekly export $week"
          git push -u origin HEAD
          gh pr create --title "Add weekly export $week"             --body "New events from the weekly scrape. Merge, then use Import latest data in the app."
