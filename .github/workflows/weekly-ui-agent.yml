name: Weekly UI agent

on:
  schedule:
    - cron: "0 22 * * 1" # Monday 22:00 UTC
  workflow_dispatch:

concurrency: weekly-ui-agent

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  ui-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic python-dotenv feedparser numpy flask -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @anthropic-ai/claude-code

      - name: Run agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "deserto-ui-agent"
          git config user.email "deserto-ui-agent@users.noreply.github.com"
          # One run a week, so the per-run cap is the weekly cap
          claude -p "$(cat .github/agents/ui-agent-prompt.md)" \
            --max-budget-usd 5 \
            --allowedTools "Read" "Edit" "Write" "Glob" "Grep" \
              "Bash(git:*)" "Bash(gh:*)" "Bash(python -m pytest:*)"
